{% extends "baseForm.html" %}
{% block title %}Delete Stock{% endblock %}
{% block content %}

      <h4 class="card-title">Delete Stock</h4>
      <p>Are you sure you want to delete <strong>{{ stock.product_name }}</strong>?</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn"><i class="bi bi-trash"></i>Yes, Delete</button>
        <a href="{% url 'accountsstock' %}" class="btn"><i class="bi bi-arrow-left"></i>Cancel</a>
      </form>
    
{% endblock %}
