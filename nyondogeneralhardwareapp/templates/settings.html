<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings - NYONDO Scheme</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <div class="card shadow">
    <div class="card-body">
      <h2 class="text-center">Settings</h2>
      <hr>
      <form>
        <div class="mb-3">
          <label class="form-label">Default Payment Interval</label>
          <select class="form-select">
            <option>Monthly</option>
            <option>Weekly</option>
            <option>Flexible</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Goods Pricing</label>
          <input type="text" class="form-control" placeholder="Cement: 30,000 UGX">
        </div>
        <div class="mb-3">
          <label class="form-label">Receipt Number Format</label>
          <input type="text" class="form-control" placeholder="RCT-YYYY-XXX">
        </div>
        <button class="btn btn-primary">Save Settings</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
