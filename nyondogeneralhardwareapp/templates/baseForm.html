<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{% endblock %}</title>

    <!-- Bootstrap + Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    {% load static %}
    <link rel="stylesheet" href="{% static 'sales-reg.css' %}" />
  </head>

  <body>
    <!-- Logo -->
    <div class="text-center my-4">
      <img
        src="{% static 'Images/Logo.png' %}"
        alt="Logo"
        style="height: 80px; width: 220px"
      />
    </div>

    <!-- Centered card wrapper -->
    <div
      class="d-flex justify-content-center align-items-center"
      style="min-height: 80vh"
    >
      <div class="card shadow-sm" style="width: 1000px; border: 3px solid  #0ABAB5; ">
        <div class="card-body" style="  background: #eceaea ">{% block content %}{% endblock %}</div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center mt-4">
      © 2026 Nyondo General Hardware. All rights reserved. | Designed by Tisha
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
