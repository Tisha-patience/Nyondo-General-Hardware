{% extends 'baseForm.html' %}
{% block title %}
  Register Stock
{% endblock %}
{% block content %}
<h5 class="mt-3">Welcome to Nyondo Stock Hardware</h5>
 
      <h1 class="card-title text-center">Register New Stock</h1>
      <hr />
      <form action="/accounts/stock-reg/" method="post">
        {% csrf_token %}
        <!-- Items -->
        <div class="row">
          <!-- Product Name -->
          <div class="col-md-6 mb-3">
            <label for="name" class="form-label">Product Name</label>
            <select class="form-select" id="name" name="product_name" required>
              <option value="Cement">Cement</option>
              <option value="Iron Bars">Iron Bars</option>
              <option value="Nails">Nails</option>
              <option value="Wheelbarrows">Wheelbarrows</option>
              <option value="Wire Mesh">Wire Mesh</option>
              <option value="Barbed Wire">Barbed Wire</option>
              <option value="Iron Sheets">Iron Sheets</option>
            </select>
          </div>

          <!-- Specification -->
          <div class="col-md-6 mb-3">
            <label for="specification" class="form-label">Specification</label>
            <select
              class="form-select"
              id="specification"
              name="specification"
              required
            >
              <!-- Cement -->
              <optgroup label="Cement">
                <option value="CEM II N">CEM II N</option>
                <option value="CEM III N">CEM III N</option>
              </optgroup>

              <!-- Iron Bars -->
              <optgroup label="Iron Bars">
                <option value="10mm">10mm</option>
                <option value="12mm">12mm</option>
                <option value="16mm">16mm</option>
              </optgroup>

              <!-- Nails -->
              <optgroup label="Nails">
                <option value="Inch 1">Inch 1</option>
                <option value="Inch 3">Inch 3</option>
                <option value="Inch 4">Inch 4</option>
                <option value="Inch 5">Inch 5</option>
                <option value="Roofing nails 5kg">
                  Roofing nails (5kg pack)
                </option>
              </optgroup>

              <!-- Wheelbarrows -->
              <optgroup label="Wheelbarrows">
                <option value="Standard">Standard</option>
                <option value="Heavy-duty">Heavy-duty</option>
              </optgroup>

              <!-- Wire Mesh -->
              <optgroup label="Wire Mesh">
                <option value="2m x 50m roll">2m × 50m roll</option>
              </optgroup>

              <!-- Barbed Wire -->
              <optgroup label="Barbed Wire">
                <option value="High tensile">High tensile</option>
                <option value="Low tensile">Low tensile</option>
              </optgroup>

              <!-- Iron Sheets -->
              <optgroup label="Iron Sheets">
                <option value="Gauge 28 Red">Gauge 28 — Red</option>
                <option value="Gauge 28 Blue">Gauge 28 — Blue</option>
                <option value="Gauge 30 Galvanized">
                  Gauge 30 — Galvanized
                </option>
              </optgroup>
            </select>
          </div>
        </div>

        <div class="row">
          <!-- Supplier -->
          <div class="col-md-6 mb-3">
            <label for="supplier" class="form-label">Supplier</label>
            <select class="form-select" id="supplier" name="supplier">
              {% for supplier in suppliers %}
              <option value="{{ supplier.id }}">{{ supplier.supplier_name }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Mode of Payment -->
          <div class="col-md-6 mb-3">
            <label for="payment_mode" class="form-label">Mode of Payment</label>
            <select
              class="form-select"
              id="payment_mode"
              name="payment_mode"
              required
            >
              <option value="Cash">Cash</option>
              <option value="Credit">Credit</option>
            </select>
          </div>

           <div  >
    <label class="form-label">Credit Terms:</label>
    <input type="text" name="credit_terms" class="form-control"  placeholder="e.g. 30 days">
  </div>
        </div>

        <!-- Row 1: Unit Cost + Unit Price -->
<div class="row">
  <div class="col-md-6 mb-3">
    <label for="unit_cost" class="form-label">Unit Cost</label>
    <input
      type="number"
      step="0.01"
      class="form-control"
      id="unit_cost"
      name="unit_cost"
      required
    />
  </div>

  <div class="col-md-6 mb-3">
    <label for="unit_price" class="form-label">Unit Price</label>
    <input
      type="number"
      step="0.01"
      class="form-control"
      id="unit_price"
      name="unit_price"
      required
    />
  </div>
</div>

<!-- Row 2: Quantity + Unit -->
<div class="row">
  <div class="col-md-6 mb-3">
    <label for="quantity" class="form-label">Quantity</label>
    <input
      type="number"
      class="form-control"
      id="quantity"
      name="quantity"
      required
    />
  </div>

  <div class="col-md-6 mb-3">
    <label class="form-label">Unit</label>
    <input
      type="text"
      name="unit"
      class="form-control"
      placeholder="e.g. bags"
    />
  </div>
</div>

        <!-- Date of Entry -->

        <div class="col">
          <label for="dateEntry" class="form-label">Date Received</label>
          <input
            type="date"
            name="date"
            class="form-control"
            id="dateEntry"
            required
          />
        </div>

        <div class="text-center">
          <button type="submit" class="btn mt-4 w-50">Add Stock</button>
          
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
