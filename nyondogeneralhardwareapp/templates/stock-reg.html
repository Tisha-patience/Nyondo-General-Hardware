<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stock Registration</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="../static/sales-reg.css" />
  </head>
  <body class="shiny-background">
    <div class="container-fluid">
      <div style="margin-left: 500px">
        <img
          src="../static/Images/Logo.png"
          style="height: 100px; width: 200px; justify-content: center"
        />
      </div>

      <h5>Welcome to Nyondo Stock Hardware</h5>
      <div class="container" style="width: 700px">
        <div class="card shadow mt-3 mb-3">
          <div class="card-body">
            <h1 class="card-title text-center">Register New Stock</h1>
            <hr />
            <form action="/" method="post">
              {% csrf_token %}
              <!-- Items -->
              <div class="row">
                <div class="col mb-3">
                  <label for="item-Name" class="form-label"
                    >Supplier Name</label
                  >
                  <input
                    type="text"
                    name="supplier_name"
                    class="form-control burgundy-form"
                    placeholder="Enter supplier name"
                    aria-label="Enter supplier name"
                    required
                  />
                </div>
                <div class="col">
                  <label for="supplierContact" class="form-label"
                    >Supplier Contact</label
                  >
                  <input
                    type="number"
                    name="supplier_contact"
                    class="form-control"
                    id="supplierContact"
                    placeholder="Enter phone number"
                    required
                  />
                </div>
                <div class="col mt">
                  <label for="quantity" class="form-label"
                    >Transport Charge</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    id="quantity"
                    placeholder="Enter charge"
                  />
                </div>

                <hr />
              </div>
              <!-- Product -->
              <div class="row">
                <div class="col mt-3">
                  <label for="productName" class="form-label"
                    >Product Name</label
                  >
                  <select
                    class="form-select product"
                    onchange="updateOptions(this)"
                  >
                    <option selected disabled>Choose product</option>
                    <option value="cement">Cement(cem iiN)</option>
                    <option value="cement">Cement(cem iiiN)</option>
                    <option value="ironbars">Iron Bars(10 mm)</option>
                    <option value="ironbars">Iron Bars(12 mm)</option>
                    <option value="ironbars">Iron Bars(16 mm)</option>
                    <option value="nails">Nails(1 inch)</option>
                    <option value="nails">Nails(3 inches)</option>
                    <option value="nails">Nails(4 inches)</option>
                    <option value="nails">{{}}</option>
                    <option value="roofingnails">Roofing Nails</option>
                    <option value="wheelbarrows">Wheelbarrows</option>
                    <option value="wiremesh">Wire Mesh</option>
                    <option value="barbedwire">
                      Barbed Wire(high tensile)
                    </option>
                    <option value="barbedwire">Barbed Wire(low tensile)</option>
                    <option value="ironsheets">
                      Iron Sheets(gauge 30 red)
                    </option>
                    <option value="ironsheets">
                      Iron Sheets(gauge 28 silver)
                    </option>
                  </select>
                </div>

                <!-- Price -->
                <div class="col mt-3">
                  <label for="salePrice" class="form-label" style="width: 170px"
                    >Unit Price</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    id="supplierPrice"
                    placeholder="Enter supplier unit price"
                    required
                  />
                </div>

                <div class="col mt-3">
                  <label for="quantity" class="form-label" style="width: 180px"
                    >Quantity</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    id="quantity"
                    placeholder="Enter quantity"
                  />
                </div>
                <div class="col text-end">
                  <button
                    type="button"
                    class="btn btn-sm"
                    onclick="deleteRow(this)"
                    style="margin-top: 50px"
                  >
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>
              <div>
                <button
                  type="button"
                  class="btn btn-secondary mt-4 mb-3"
                  onclick="addRow()"
                >
                  <i class="bi bi-plus-circle me-1"></i> Add Item
                </button>
              </div>

              <!-- Date of Entry -->
              <div class="row">
                <div class="col">
                  <label for="dateEntry" class="form-label"
                    >Date Received</label
                  >
                  <input
                    type="date"
                    class="form-control"
                    id="dateEntry"
                    required
                  />
                </div>
              </div>
              <hr />

              <!-- Submit Button -->
              <div class="row">
                <div class="col">
                  <button type="submit" class="btn">Save Stock</button>
                </div>
                <div class="col text-end">
                  <a href="stock.html" class="btn ms-2"
                    ><i class="bi bi-arrow-left me-1"></i>Back</a
                  >
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <footer class="text-center">
        © 2026 Nyondo General Hardware. All rights reserved. | Designed by Tisha
      </footer>
    
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
