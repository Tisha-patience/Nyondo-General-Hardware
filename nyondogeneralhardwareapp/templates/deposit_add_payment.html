{% extends 'baseForm.html' %}
{% block title %} Add Payment {% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="card shadow mx-auto" style="max-width: 700px; border: 3px solid #0ABAB5;">
    <div class="card-body">
      <h2 class="text-center">Add Payment for {{ participant.name }}</h2>
      <hr />

      <form method="post">
        {% csrf_token %}

        <!-- Product -->
        <div class="mb-3">
          <label class="form-label">Product</label>
          <select class="form-select" name="product" required>
            <option selected disabled>Choose product</option>
            <option value="cement">Cement</option>
            <option value="ironSheets">Iron Sheets</option>
            <option value="bars">Bars</option>
          </select>
        </div>

        <!-- Amount -->
        <div class="mb-3">
          <label class="form-label">Amount Paid</label>
          <input type="number" name="amount_paid" class="form-control" required>
        </div>

        <!-- Payment Method -->
        <div class="mb-3">
          <label class="form-label">Payment Method</label>
          <select class="form-select" name="payment_method" required>
            <option selected disabled>Choose method</option>
            <option value="cash">Cash Deposit</option>
            <option value="mobile">Mobile Money</option>
          </select>
        </div>

        <!-- Date -->
        <div class="mb-3">
          <label class="form-label">Date Registered</label>
          <input type="date" name="date_registered" class="form-control" required>
        </div>

        <!-- Submit -->
        <div class="row">
          <div class="col">
            <button type="submit" class="btn btn-primary">Save Payment</button>
          </div>
          <div class="col text-end">
            <a href="{% url 'customer_profile' participant.pk %}" class="btn btn-secondary">
              <i class="bi bi-arrow-left me-1"></i> Back to Profile
            </a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
