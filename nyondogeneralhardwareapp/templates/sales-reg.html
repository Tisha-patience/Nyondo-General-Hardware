{% extends 'baseForm.html' %}
{% block title %} Register Sale {% endblock %}

{% block content %}
<div class="card shadow mx-auto" style="max-width:900px">
  <div class="card-body">
    <h1 class="card-title text-center">Sales Form</h1>
    <hr />

    <form method="post" action="/">
      {% csrf_token %}

      <!-- Customer Details -->
      <h4 class="text-center">Customer Details</h4>
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Customer Name</label>
          <input type="text" name="customer_name" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone Number</label>
          <input type="text" name="customer_phone" class="form-control" required>
        </div>
      </div>

      <hr />

      <!-- Items -->
      <h4 class="text-center">Items</h4>
      <div id="items-container">
        <div class="row mb-3 item-row">
          <div class="col-md-2">
             <label for="name" class="form-label">Product Name</label>
            <select class="form-select" id="name" name="product_name" required>
              <option value="Cement">Cement</option>
              <option value="Iron Bars">Iron Bars</option>
              <option value="Nails">Nails</option>
              <option value="Wheelbarrows">Wheelbarrows</option>
              <option value="Wire Mesh">Wire Mesh</option>
              <option value="Barbed Wire">Barbed Wire</option>
              <option value="Iron Sheets">Iron Sheets</option>
            </select>
          </div>
          <div class="col-md-3">
            <label for="specification" class="form-label">Specification</label>
            <select
              class="form-select"
              id="specification"
              name="specification"
              required
            >
              <!-- Cement -->
              <optgroup label="Cement">
                <option value="CEM II N">CEM II N</option>
                <option value="CEM III N">CEM III N</option>
              </optgroup>

              <!-- Iron Bars -->
              <optgroup label="Iron Bars">
                <option value="10mm">10mm</option>
                <option value="12mm">12mm</option>
                <option value="16mm">16mm</option>
              </optgroup>

              <!-- Nails -->
              <optgroup label="Nails">
                <option value="Inch 1">Inch 1</option>
                <option value="Inch 3">Inch 3</option>
                <option value="Inch 4">Inch 4</option>
                <option value="Inch 5">Inch 5</option>
                <option value="Roofing nails 5kg">
                  Roofing nails (5kg pack)
                </option>
              </optgroup>

              <!-- Wheelbarrows -->
              <optgroup label="Wheelbarrows">
                <option value="Standard">Standard</option>
                <option value="Heavy-duty">Heavy-duty</option>
              </optgroup>

              <!-- Wire Mesh -->
              <optgroup label="Wire Mesh">
                <option value="2m x 50m roll">2m × 50m roll</option>
              </optgroup>

              <!-- Barbed Wire -->
              <optgroup label="Barbed Wire">
                <option value="High tensile">High tensile</option>
                <option value="Low tensile">Low tensile</option>
              </optgroup>

              <!-- Iron Sheets -->
              <optgroup label="Iron Sheets">
                <option value="Gauge 28 Red">Gauge 28 — Red</option>
                <option value="Gauge 28 Blue">Gauge 28 — Blue</option>
                <option value="Gauge 30 Galvanized">
                  Gauge 30 — Galvanized
                </option>
              </optgroup>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label">Quantity</label>
            <input type="number" name="quantity" class="form-control" required>
          </div>
          <div class="col-md-2">
            <label class="form-label">Unit</label>
            <input type="text" name="unit" class="form-control" required>
          </div>
          <div class="col-md-2">
            <label class="form-label">Unit Price</label>
            <input type="number" step="0.01" name="unit_price" class="form-control" required>
          </div>
          <div class="col-md-1 d-flex align-items-end">
            <button type="button" class="btn btn-sm  remove-item w-100">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <button type="button" id="add-item" class="btn">
          <i class="bi bi-plus-circle"></i> Add Item
        </button>
      </div>

      <hr />

      <!-- Totals -->
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Delivery Distance (km)</label>
          <input type="number" name="distance_km" id="distance_km" class="form-control" min="0">
        </div>
        <div class="col-md-6">
          <label class="form-label">Transport Cost (UGX)</label>
          <input type="number" name="transport_cost" id="transport_cost" class="form-control" readonly>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Final Total (UGX)</label>
        <input type="number" name="grand_total" id="grand_total" class="form-control" readonly>
      </div>

      <!-- Submit -->
      <div class="row">
        <div class="col">
          <button type="submit" class="btn">
            <i class="bi bi-save"></i> Save Sale
          </button>
        </div>
        <div class="col text-end">
          <a href="{% url 'accountssales' %}" class="btn">
            <i class="bi bi-arrow-left"></i> Back
          </a>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const container = document.getElementById("items-container");
  const addBtn = document.getElementById("add-item");

  addBtn.addEventListener("click", function() {
    const newRow = container.querySelector(".item-row").cloneNode(true);
    newRow.querySelectorAll("input").forEach(el => el.value = "");
    container.appendChild(newRow);
  });

  container.addEventListener("click", function(e) {
    if (e.target.closest(".remove-item")) {
      const rows = container.querySelectorAll(".item-row");
      if (rows.length > 1) {
        e.target.closest(".item-row").remove();
      }
    }
  });
});
</script>
{% endblock %}
