<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sales Registration Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="../static/sales-reg.css" />
  </head>

  <body>
    <div style="margin-left: 500px">
      <img
        src="../static/Images/Logo.png"
        alt="Logo"
        style="height: 100px; width: 200px; justify-content: center"
      />
    </div>
    <div class="container">
      <div
        class="card shadow"
        style="margin: 20px; margin-left: 300px; width: 500px"
      >
        <div class="card-body">
          <h1 class="card-title text-center">Sales Form</h1>
          <hr />
          <form>
            <h2 class="text-center">Customer Details</h2>

            <div class="row my-3">
              <div class="col">
                <label for="fullname" class="form-label">Customer Name</label>
                <input
                  type="text"
                  id="fullname"
                  class="form-control"
                  placeholder="Full name"
                  aria-label="Full name"
                  style="background-color: white"
                />
              </div>
              <div class="col">
                <label for="phone" class="form-label">Phone Number</label>
                <input
                  type="number"
                  id="phone"
                  class="form-control"
                  placeholder="Enter phone number"
                  aria-label=""
                  style="background-color: white"
                />
              </div>
            </div>
            <!-- end section 1 -->
            <div class="col">
              <label for="customerType" class="form-label">Type</label>
              <select
                class="form-select"
                id="customerType"
                aria-label="Customer type"
                style="background-color: white"
              >
                <option selected disabled>Select a customer type</option>
                <option value="retail">retail customer</option>
                <option value="wholesale">wholesale customer</option>
                <option value="individual">Individual buyer</option>
              </select>
            </div>
            <hr />
            <!-- end of section 2 -->

            <div class="row my-3">
              <h2 class="text-center">Items</h2>
              <div class="col">
                <label for="pdtId" class="form-label" style="width: 190px"
                  >Product Name</label
                >
                <select
                  class="form-select product"
                  onchange="updateOptions(this)"
                  style="background-color: white"
                >
                  <option selected disabled>Choose product</option>
                  <option value="cement">Cement(cem iiN)</option>
                  <option value="cement">Cement(cem iiiN)</option>
                  <option value="ironbars">Iron Bars(10 mm)</option>
                  <option value="ironbars">Iron Bars(12 mm)</option>
                  <option value="ironbars">Iron Bars(16 mm)</option>
                  <option value="nails">Nails(1 inch)</option>
                  <option value="nails">Nails(3 inches)</option>
                  <option value="nails">Nails(4 inches)</option>
                  <option value="nails">Nails(5 inches)</option>
                  <option value="roofingnails">Roofing Nails</option>
                  <option value="wheelbarrows">Wheelbarrows</option>
                  <option value="wiremesh">Wire Mesh</option>
                  <option value="barbedwire">Barbed Wire(high tensile)</option>
                  <option value="barbedwire">Barbed Wire(low tensile)</option>
                  <option value="ironsheets">Iron Sheets(gauge 30 red)</option>
                  <option value="ironsheets">
                    Iron Sheets(gauge 28 silver)
                  </option>
                </select>
              </div>

              <div class="col">
                <label class="form-label" style="width: 190px">Quantity</label>
                <input
                  type="number"
                  class="form-control"
                  placeholder="Enter Quantity"
                  style="background-color: white"
                />
              </div>
              <div class="col text-end">
                <button
                  type="button"
                  class="btn btn-sm"
                  onclick="deleteRow(this)"
                  style="margin-top: 40px"
                >
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>
            <!-- 1 row end -->
            <div class="row my-3">
              <div class="col">
                <label for="pdtId" class="form-label">Product Name</label>
                <select
                  class="form-select product"
                  onchange="updateOptions(this)"
                  style="width: 190px; background-color: white"
                >
                  <option selected disabled>Choose product</option>
                  <option value="cement">Cement(cem iiN)</option>
                  <option value="cement">Cement(cem iiiN)</option>
                  <option value="ironbars">Iron Bars(10 mm)</option>
                  <option value="ironbars">Iron Bars(12 mm)</option>
                  <option value="ironbars">Iron Bars(16 mm)</option>
                  <option value="nails">Nails(1 inch)</option>
                  <option value="nails">Nails(3 inches)</option>
                  <option value="nails">Nails(4 inches)</option>
                  <option value="nails">Nails(5 inches)</option>
                  <option value="roofingnails">Roofing Nails</option>
                  <option value="wheelbarrows">Wheelbarrows</option>
                  <option value="wiremesh">Wire Mesh</option>
                  <option value="barbedwire">Barbed Wire(high tensile)</option>
                  <option value="barbedwire">Barbed Wire(low tensile)</option>
                  <option value="ironsheets">Iron Sheets(gauge 30 red)</option>
                  <option value="ironsheets">
                    Iron Sheets(gauge 28 silver)
                  </option>
                </select>
              </div>

              <div class="col">
                <label class="form-label" style="width: 190px">Quantity</label>
                <input
                  type="number"
                  class="form-control"
                  placeholder="Enter Quantity"
                  style="background-color: white"
                />
              </div>

              <div class="col text-end">
                <button
                  type="button"
                  class="btn btn-sm"
                  onclick="deleteRow(this)"
                  style="margin-top: 40px"
                >
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>

            <div>
              <button
                type="button"
                class="btn btn-secondary mb-3"
                onclick="addRow()"
              >
                <i class="bi bi-plus-circle me-1"></i> Add Item
              </button>
            </div>
            <div class="mb-3">
              <label class="form-label">Customer Location</label>
              <select
                class="form-select"
                name="location"
                required
                style="background-color: white"
              >
                <option value="nabweru">Nabweru (5 km)</option>
                <option value="wakiso">Wakiso Town (8 km)</option>
                <option value="kampala">Kampala Central (12 km)</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Goods Value (UGX)</label>
              <input
                type="number"
                class="form-control"
                id="goodsValue"
                readonly
                style="background-color: white"
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Transport Cost</label>
              <input
                type="number"
                class="form-control"
                name="transport_cost"
                readonly
                style="background-color: white"
              />
            </div>
            <div class="row">
              <div class="col">
                <button type="submit" class="btn">Save Sale</button>
              </div>
              <div class="col text-end">
                <a href="../templates/sales.html" class="btn ms-2"
                  ><i class="bi bi-arrow-left me-1"></i>Back</a
                >
              </div>
            </div>
          </form>
        </div>
      </div>
      <footer class="text-center">
        © 2026 Nyondo General Hardware. All rights reserved. | Designed by Tisha
      </footer>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
