<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sales Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../static/sales-reg.css" />
</head>

<body>
  <div style="margin-left: 500px;">
    <img src="../static/Images/Logo.png" style="height: 100px; width: 200px; justify-content: center" />
  </div>
  <div class="container">
    <div class="card shadow  " style="margin: 20px; margin-left: 300px;   width: 500px; ">
      <div class="card-body ">
        <h1 class="card-title text-center">Sales Form</h1>
        <hr>
        <form>
          <h2 class="text-center">Customer Details</h2>

          <div class="row my-3">
            <div class="col">
              <label for="fullname" class="form-label">Customer Name</label>
              <input type="text" id="fullname" class="form-control" placeholder="Full name" aria-label="Full name" />
            </div>
            <div class="col">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="number" id="phone" class="form-control" placeholder="Enter phone number" aria-label="" />
            </div>
          </div>
          <!-- end section 1 -->
          <div class="col">
            <label for="customerType" class="form-label">Type</label>
            <select class="form-select" id="customerType" aria-label="Customer type">
              <option selected disabled>Select a customer type</option>
              <option value="retail">retail customer</option>
              <option value="wholesale">wholesale customer</option>
            </select>
          </div>
          <hr>
          <!-- end of section 2 -->

          <div class="row my-3">
            <h2 class="text-center">Items</h2>
            <div class="col">
              <label for="pdtId" class="form-label" style="width: 190px;">Product Name</label>
              <select class="form-select product" onchange="updateOptions(this)">
                <option selected disabled>Choose product</option>
                <option value="cement">Cement</option>
                <option value="ironbars">Iron Bars</option>
                <option value="nails">Nails</option>
                <option value="wheelbarrows">Wheelbarrows</option>
                <option value="wiremesh">Wire Mesh</option>
                <option value="barbedwire">Barbed Wire</option>
                <option value="ironsheets">Iron Sheets</option>
              </select>
            </div>

            

            <div class="col">
              <label for="quantity" class="form-label" style="width: 190px;">Quantity</label>
              <input type="text" id="quantity" class="form-control" placeholder="Enter Quantity"
                aria-label="quantity" />
            </div>
            <div class="col text-end">
              <button type="button" class="btn  btn-sm" onclick="deleteRow(this)" style="margin-top: 40px;">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>
          <!-- 1 row end -->
          <div class="row my-3">
            <div class="col">
              <label for="pdtId" class="form-label">Product Name</label>
              <select class="form-select product" onchange="updateOptions(this)" style="width: 190px;">
                <option selected disabled>Choose product</option>
                <option value="cement">Cement</option>
                <option value="ironbars">Iron Bars</option>
                <option value="nails">Nails</option>
                <option value="wheelbarrows">Wheelbarrows</option>
                <option value="wiremesh">Wire Mesh</option>
                <option value="barbedwire">Barbed Wire</option>
                <option value="ironsheets">Iron Sheets</option>
              </select>
            </div>
           
            <div class="col ">
              <label for="quantity" class="form-label" style="width: 190px;">Quantity</label>
              <input type="number" id="quantity" class="form-control" placeholder="Enter Quantity"
                aria-label="quantity"/>
            </div>

            <div class="col text-end">
              <button type="button" class="btn  btn-sm" onclick="deleteRow(this)" style="margin-top: 40px;">
                <i class="bi bi-trash"></i>
              </button>
            </div>

          </div>

          <div>
            <button type="button" class="btn btn-secondary mb-3" onclick="addRow()">
              <i class="bi bi-plus-circle me-1"></i> Add Item
            </button>
          </div>
          
          <div class="row">
            <div class="col ">
              <button type="submit" class="btn">Save Sale</button>
            </div>
            <div class="col text-end">
              <a href="./sales/sales.html" class="btn ms-2 "><i class="bi bi-arrow-left me-1"></i>Back</a>
            </div>

          </div>
        </form>
      </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
</body>

</html>
