<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sales Registration Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="../static/sales-reg.css" />
  </head>

  <body>
    <div style="margin-left: 600px">
      <img
        src="../static/Images/Logo.png"
        alt="Logo"
        style="height: 100px; width: 200px; justify-content: center"
      />
    </div>
    <div class="container">
      <div
        class="card shadow"
        style="margin: 20px; margin-left: 370px; width: 500px"
      >
        <div class="card-body">
          <h1 class="card-title text-center">Sales Form</h1>
          <hr />
          <form method="post" action="/">
            {% csrf_token %}
            <h2 class="text-center">Customer Details</h2>

            <div class="row my-3">
              <div class="col">
                <label for="fullname" class="form-label">Customer Name</label>
                <input
                  type="text"
                  id="fullname"
                  class="form-control"
                  placeholder="Full name"
                  aria-label="Full name"
                />
              </div>
              <div class="col">
                <label for="phone" class="form-label">Phone Number</label>
                <input
                  type="number"
                  id="phone"
                  class="form-control"
                  placeholder="Enter phone number"
                  aria-label=""
                  style="background-color: white"
                />
              </div>
            </div>
            <!-- end section 1 -->
            
            <hr />
            <!-- end of section 2 -->

            <div class="row my-3">
              <h2 class="text-center">Items</h2>
              <div class="col">
                <label for="pdtId" class="form-label" style="width: 190px"
                  >Product Name</label
                >
                <select
                  class="form-select product"
                  onchange="updateOptions(this)"
                  style="background-color: white"
                >
                  <option selected disabled>Choose product</option>
                  <option value="cement">Cement(cem iiN)</option>
                  <option value="cement">Cement(cem iiiN)</option>
                  <option value="ironbars">Iron Bars(10 mm)</option>
                  <option value="ironbars">Iron Bars(12 mm)</option>
                  <option value="ironbars">Iron Bars(16 mm)</option>
                  <option value="nails">Nails(1 inch)</option>
                  <option value="nails">Nails(3 inches)</option>
                  <option value="nails">Nails(4 inches)</option>
                  <option value="nails">Nails(5 inches)</option>
                  <option value="roofingnails">Roofing Nails</option>
                  <option value="wheelbarrows">Wheelbarrows</option>
                  <option value="wiremesh">Wire Mesh</option>
                  <option value="barbedwire">Barbed Wire(high tensile)</option>
                  <option value="barbedwire">Barbed Wire(low tensile)</option>
                  <option value="ironsheets">Iron Sheets(gauge 30 red)</option>
                  <option value="ironsheets">
                    Iron Sheets(gauge 28 silver)
                  </option>
                </select>
              </div>

              <div class="col">
                <label class="form-label" style="width: 190px">Quantity</label>
                <input
                  type="number"
                  class="form-control"
                  placeholder="Enter Quantity"
                  style="background-color: white"
                />
              </div>
              <div class="col text-end">
                <button
                  type="button"
                  class="btn btn-sm"
                  onclick="deleteRow(this)"
                  style="margin-top: 40px"
                >
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>
            <!-- 1 row end -->
            <div class="row my-3">
              <div class="col">
                <label for="pdtId" class="form-label">Product Name</label>
                <select
                  class="form-select product"
                  onchange="updateOptions(this)"
                  style="width: 190px; background-color: white"
                >
                  <option selected disabled>Choose product</option>
                  <option value="cement">Cement(cem iiN)</option>
                  <option value="cement">Cement(cem iiiN)</option>
                  <option value="ironbars">Iron Bars(10 mm)</option>
                  <option value="ironbars">Iron Bars(12 mm)</option>
                  <option value="ironbars">Iron Bars(16 mm)</option>
                  <option value="nails">Nails(1 inch)</option>
                  <option value="nails">Nails(3 inches)</option>
                  <option value="nails">Nails(4 inches)</option>
                  <option value="nails">Nails(5 inches)</option>
                  <option value="roofingnails">Roofing Nails</option>
                  <option value="wheelbarrows">Wheelbarrows</option>
                  <option value="wiremesh">Wire Mesh</option>
                  <option value="barbedwire">Barbed Wire(high tensile)</option>
                  <option value="barbedwire">Barbed Wire(low tensile)</option>
                  <option value="ironsheets">Iron Sheets(gauge 30 red)</option>
                  <option value="ironsheets">
                    Iron Sheets(gauge 28 silver)
                  </option>
                </select>
              </div>

              <div class="col">
                <label class="form-label" style="width: 190px">Quantity</label>
                <input
                  type="number"
                  class="form-control"
                  placeholder="Enter Quantity"
                  style="background-color: white"
                />
              </div>

              <div class="col text-end">
                <button
                  type="button"
                  class="btn btn-sm"
                  onclick="deleteRow(this)"
                  style="margin-top: 40px"
                >
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>

            <div>
              <button
                type="button"
                class="btn btn-secondary mb-3"
                onclick="addRow()"
              >
                <i class="bi bi-plus-circle me-1"></i> Add Item
              </button>
            </div>
            <!-- Total Amount -->
            <div class="form-group">
              <label for="total_price">Total Amount (UGX)</label>
              <input
                type="number"
                step="0.01"
                name="total_price"
                id="total_price"
                class="form-control"
                required
              />
              <small class="form-text text-muted">
                This should equal <strong>quantity × unit price</strong>.
              </small>
            </div>
            <!-- Transport Distance -->
            <div class="form-group">
              <label for="distance_km">Delivery Distance (km)</label>
              <input
                type="number"
                name="distance_km"
                id="distance_km"
                class="form-control"
                min="0"
              />
              <small class="form-text text-muted">
                Free transport if within 10 km and total ≥ 500,000 UGX, else
                30,000 UGX.
              </small>
            </div>

            <!-- Transport Cost -->
            <div class="form-group">
              <label for="transport_cost">Transport Cost (UGX)</label>
              <input
                type="number"
                step="0.01"
                name="transport_cost"
                id="transport_cost"
                class="form-control"
                readonly
              />
              <small class="form-text text-muted">
                Auto-calculated based on distance and total amount.
              </small>
            </div>

            <div class="row">
              <div class="col">
                <button type="submit" class="btn">Save Sale</button>
              </div>
              <div class="col text-end">
                <a href="../templates/sales.html" class="btn ms-2"
                  ><i class="bi bi-arrow-left me-1"></i>Back</a
                >
              </div>
            </div>
          </form>
        </div>
      </div>
      <footer class="text-center">
        © 2026 Nyondo General Hardware. All rights reserved. | Designed by Tisha
      </footer>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
