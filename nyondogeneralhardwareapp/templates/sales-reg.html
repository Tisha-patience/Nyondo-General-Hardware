{% extends 'baseForm.html' %}
{% block title %} Register Sale {% endblock %}

{% block content %}
<div class="card shadow mx-auto" style="max-width: 800px;">
  <div class="card-body">
    <h1 class="card-title text-center">Sales Form</h1>
    <hr />

    <form method="post" action="/">
      {% csrf_token %}

      <!-- Customer Details -->
      <h4 class="text-center">Customer Details</h4>
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="fullname" class="form-label">Customer Name</label>
          <input type="text" id="fullname" name="customer_name"
                 class="form-control" placeholder="Full name" required>
        </div>
        <div class="col-md-6">
          <label for="phone" class="form-label">Phone Number</label>
          <input type="number" id="phone" name="customer_phone"
                 class="form-control" placeholder="Enter phone number" required>
        </div>
      </div>

      <hr />

      <!-- Items -->
      <h4 class="text-center">Items</h4>
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="pdtId" class="form-label">Product Name</label>
          <select class="form-select" name="product" required>
            <option selected disabled>Choose product</option>
            <option value="cement">Cement (cem iiN)</option>
            <option value="ironbars">Iron Bars (10 mm)</option>
            <!-- add more options -->
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Quantity</label>
          <input type="number" name="quantity" class="form-control"
                 placeholder="Enter Quantity" required>
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button type="button" class="btn btn-sm btn-outline-danger w-100">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>

      <div class="mb-3">
        <button type="button" class="btn btn-outline-secondary">
          <i class="bi bi-plus-circle"></i> Add Item
        </button>
      </div>

      <!-- Totals -->
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="total_price" class="form-label">Total Amount (UGX)</label>
          <input type="number" step="0.01" name="total_price" id="total_price"
                 class="form-control" required>
        </div>
        <div class="col-md-6">
          <label for="distance_km" class="form-label">Delivery Distance (km)</label>
          <input type="number" name="distance_km" id="distance_km"
                 class="form-control" min="0">
        </div>
      </div>

      <div class="mb-3">
        <label for="transport_cost" class="form-label">Transport Cost (UGX)</label>
        <input type="number" step="0.01" name="transport_cost" id="transport_cost"
               class="form-control" readonly>
      </div>

      <!-- Submit + Back -->
      <div class="row">
        <div class="col">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i> Save Sale
          </button>
        </div>
        <div class="col text-end">
          <a href="{% url 'accountssales' %}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back
          </a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
