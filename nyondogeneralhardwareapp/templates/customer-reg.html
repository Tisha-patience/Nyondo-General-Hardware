{% extends 'baseForm.html' %} 
{% block title %}
 Nyondo Deposit Form 
{% endblock%} 
{% block content %}
<div class="container mt-4">
  <div class="card shadow mx-auto" style="max-width: 700px; border: 5px solid  #0ABAB5">
    <div class="card-body">
      <h2 class="text-center">Enroll in NYONDO Scheme</h2>
      <hr />
      <form method="post" action="/accounts/customer-reg/">
        {% csrf_token %}
        <!-- Personal Info -->
        <div class="mb-3">
          <label class="form-label">Full Name (as on National ID)</label>
          <input type="text" name="name" class="form-control" required />
        </div>

        <div class="mb-3">
          <label class="form-label">National Identification Number (NIN)</label>
          <input type="text" name="nin" class="form-control" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <input type="number" name="number" class="form-control" required />
        </div>

        <!-- Product Choice -->
        <div class="mb-3">
          <label class="form-label">Product to Deposit For</label>
          <select class="form-select" name="product" required>
            <option selected disabled>Choose product</option>
            <option value="cement">Cement</option>
            <option value="ironSheets">Iron Sheets</option>
            <option value="bars"> Iron Bars</option>
          </select>
        </div>
 <label class="form-label">First Amount Deposited</label>
  <input type="number" name="amount_paid" class="form-control" required>

        <!-- Payment Method -->
        <div class="mb-3">
          <label class="form-label">Payment Method</label>
          <select class="form-select" name="payment_method" required>
            <option selected disabled>Choose method</option>
            <option value="cash">Cash Deposit</option>
            <option value="mobile">Mobile Money</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Date Registered</label>
          <input type="date" name="date" class="form-control" required />
        </div>
        <!-- Agreement -->
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" required />
          <label class="form-check-label"
            >I confirm my details match my National ID and agree to the scheme
            terms</label
          >
        </div>

        <!-- Submit -->
        <div class="row">
          <div class="col">
            <button type="submit" class="btn">Add Customer</button>
          </div>
          <div class="col text-end">
            <a
              href="{% url 'accountscustomer-deposit' %}"
              class="btn btn-secondary"
            >
              <i class="bi bi-arrow-left me-1"></i> Back
            </a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
