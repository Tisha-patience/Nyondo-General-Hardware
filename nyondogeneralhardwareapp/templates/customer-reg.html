<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Registration</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../static/index.css" />
    <link rel="stylesheet" href="../static/sales-reg.css">
    <style></style>
  </head>

  <body>
    
    <div style="margin-left: 500px">
      <img
        src="../static/Images/Logo.png"
        alt="Logo"
        style="height: 100px; width: 200px; justify-content: center"
      />
    </div>

    
<div class="container mt-4">
  <div class="card shadow mx-auto" style="max-width: 700px;">
    <div class="card-body">
      <h2 class="text-center">Enroll in NYONDO Scheme</h2>
      <hr>
      <form id="nyondoRegistrationForm">
        
        <!-- Personal Info -->
        <div class="mb-3">
          <label class="form-label">Full Name (as on National ID)</label>
          <input type="text" class="form-control" required style="
                    background-color: #fdfdfd;
                    border: 2px solid #a67c8a;
                    color: #333;
                    border-radius: 6px;
                    box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                  ">
        </div>
        
        <div class="mb-3">
          <label class="form-label">National Identification Number (NIN)</label>
          <input type="text" class="form-control" required style="
                    background-color: #fdfdfd;
                    border: 2px solid #a67c8a;
                    color: #333;
                    border-radius: 6px;
                    box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                  ">
        </div>
        
        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-control" required style="
                    background-color: #fdfdfd;
                    border: 2px solid #a67c8a;
                    color: #333;
                    border-radius: 6px;
                    box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                  ">
        </div>
        
        <div class="mb-3">
          <label class="form-label">Employer / Workplace</label>
          <input type="text" class="form-control" style="
                    background-color: #fdfdfd;
                    border: 2px solid #a67c8a;
                    color: #333;
                    border-radius: 6px;
                    box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                  ">
        </div>
        
        <div class="mb-3">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" style="
                    background-color: #fdfdfd;
                    border: 2px solid #a67c8a;
                    color: #333;
                    border-radius: 6px;
                    box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                  ">
        </div>
        
        <!-- Payment Interval -->
        <div class="mb-3">
          <label class="form-label">Payment Interval</label>
          <select class="form-select" required style="
                    background-color: #fdfdfd;
                    border: 2px solid #a67c8a;
                    color: #333;
                    border-radius: 6px;
                    box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                  ">
            <option selected disabled>Choose interval</option>
            <option value="monthly">Monthly</option>
            <option value="weekly">Weekly</option>
            <option value="flexible">Whenever deposit is made</option>
          </select>
        </div>
        
        <!-- Product Choice -->
        <div class="mb-3">
          <label class="form-label">Product to Deposit For</label>
          <select class="form-select" required style="
                    background-color: #fdfdfd;
                    border: 2px solid #a67c8a;
                    color: #333;
                    border-radius: 6px;
                    box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                  ">
            <option selected disabled>Choose product</option>
            <option value="cement">Cement</option>
            <option value="ironSheets">Iron Sheets</option>
            <option value="bars">Bars</option>
          </select>
        </div>
        
        <!-- Payment Method -->
        <div class="mb-3">
          <label class="form-label">Payment Method</label>
          <select class="form-select" required style="
                    background-color: #fdfdfd;
                    border: 2px solid #a67c8a;
                    color: #333;
                    border-radius: 6px;
                    box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                  ">
            <option selected disabled>Choose method</option>
            <option value="salary">Salary Deduction</option>
            <option value="cash">Cash Deposit</option>
            <option value="mobile">Mobile Money</option>
          </select>
        </div>
        
        <!-- Agreement -->
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" required style="
                    background-color: #fdfdfd;
                    border: 2px solid #a67c8a;
                    color: #333;
                    border-radius: 6px;
                    box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                  " />
          <label class="form-check-label">I confirm my details match my National ID and agree to the scheme terms</label>
        </div>
        
        <!-- Submit -->
          <div class="row">
              <div class="col">
            <button type="submit" class="btn">Register</button>
            </div>
              <div class="col text-end">
            <a href="nyondo-participants.html" class="btn btn-secondary">
              <i class="bi bi-arrow-left me-1"></i> Back
            </a>
            </div>
        
      </form>
    </div>
  </div>
</div>

<div class="container-fluid">
      <footer class="text-center border-top text-muted">
        © 2026 Nyondo General Hardware. All rights reserved. | Designed by Tisha
      </footer>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
