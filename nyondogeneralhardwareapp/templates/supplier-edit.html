<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Supplier</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="../static/sales-reg.css" />
  </head>
  <body class="shiny-background">
    <div class="container-fluid">
      <div style="margin-left: 500px">
        <img
          src="../static/Images/Logo.png"
          style="height: 100px; width: 200px; justify-content: center"
        />
      </div>
      <div class="container mt-4">
        <div class="card shadow mx-auto" style="max-width: 700px">
          <div class="card-body">
            <h2 class="text-center">Edit Supplier</h2>
            <hr />
            <form method="post" action="/">
              {% csrf_token%}
              <!-- Supplier Info -->
              <div class="mb-3">
                <label class="form-label">Supplier Name</label>
                <input
                  type="text"
                  class="form-control"
                  value="XYZ Traders Ltd."
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label">Contact Number</label>
                <input
                  type="text"
                  class="form-control"
                  value="+256 700 123456"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  value="xyztraders@gmail.com"
                  required
                />
              </div>

              <!-- Payment Terms -->
              <div class="mb-3">
                <label class="form-label">Payment Terms</label>
                <select class="form-select">
                  <option value="cash">Cash on Delivery</option>
                  <option value="credit" selected>Credit</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Credit Terms</label>
                <input
                  type="text"
                  class="form-control"
                  name="credit_terms"
                  value="Pay within 30 days"
                  required
                />
              </div>

              <!-- Notes -->
              <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea class="form-control">
Preferred supplier for cement deliveries</textarea
                >
              </div>

              <!-- Submit -->
              <div class="row">
                <div class="col">
                  <button type="submit" class="btn">Save Changes</button>
                </div>
                <div class="col text-end">
                  <a href="supplier.html" class="btn">
                    <i class="bi bi-arrow-left me-1"></i> Back
                  </a>
                </div>
              </div>
            </form>
          </div>
        </div>
        <footer class="text-center">
          © 2026 Nyondo General Hardware. All rights reserved. | Designed by
          Tisha
        </footer>
      </div>
    </div>
  </body>
</html>
