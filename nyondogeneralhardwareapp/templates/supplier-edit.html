{% extends "baseForm.html" %}

{% block title %}Edit Supplier{% endblock %}

{% block content %}
  <h3 class="text-center">Edit Supplier</h3>
  <hr>
  <form method="post" action="{% url 'supplier_edit' supplier.id supplier.slug %}">
    {% csrf_token %}

   <div class="row mb-3">
  <!-- Supplier Name -->
  <div class="col-md-6">
    <label for="supplier_name" class="form-label">Supplier Name</label>
    <input type="text" name="supplier_name" id="supplier_name"
           class="form-control" value="{{ supplier.supplier_name }}">
  </div>

  <!-- Contact Number -->
  <div class="col-md-6">
    <label for="contact_number" class="form-label">Contact Number</label>
    <input type="text" name="contact_number" id="contact_number"
           class="form-control" value="{{ supplier.contact_number }}">
  </div>
</div>


    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" name="email" id="email"
             class="form-control" value="{{ supplier.email }}">
    </div>

    <div class="mb-3">
      <label for="address" class="form-label">Address</label>
      <textarea name="address" id="address" class="form-control">{{ supplier.address }}</textarea>
    </div>


    
    <button type="submit" class="btn ">
      <i class="bi bi-save"></i>
    </button>
    <a href="{% url 'accountssupplier' %}" class="btn">
      <i class="bi bi-x-circle"></i>
    </a>
  </form>
{% endblock %}
