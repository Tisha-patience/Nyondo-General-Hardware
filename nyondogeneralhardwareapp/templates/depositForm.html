<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NYONDO Deposit Receipt</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../static/sales-reg.css" />
  </head>

  <body>
    <div style="margin-left: 500px">
      <img
        src="../static/Images/Logo.png"
        alt="Logo"
        style="height: 100px; width: 200px; justify-content: center"
      />
    </div>
    <div class="container mt-4">
      <div class="card shadow mx-auto" style="max-width: 700px;">
        <div class="card-body">
          <h2 class="text-center">NYONDO Deposit Receipt Form</h2>
          <hr />
          <form>
            <div class="mb-3">
              <label class="form-label">Receipt No</label>
              <input type="text" class="form-control" value="RCT-2026-001" readonly />
            </div>
            <div class="mb-3">
              <label class="form-label">Date</label>
              <input type="text" class="form-control" value="13 Apr 2026" readonly />
            </div>
            <div class="mb-3">
              <label class="form-label">Participant Name</label>
              <input type="text" class="form-control" placeholder="Enter participant name" />
            </div>
            <div class="mb-3">
              <label class="form-label">NIN</label>
              <input type="text" class="form-control" placeholder="Enter NIN" />
            </div>
            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-control" placeholder="Enter phone number" />
            </div>
            <div class="mb-3">
              <label class="form-label">Employer</label>
              <input type="text" class="form-control" placeholder="Enter employer name" />
            </div>
            <div class="mb-3">
              <label class="form-label">Amount Paid</label>
              <input type="text" class="form-control" placeholder="Enter deposit amount" />
            </div>
            <div class="mb-3">
              <label class="form-label">Cumulative Balance</label>
              <input type="text" class="form-control" placeholder="Auto-calculated balance" />
            </div>
            <div class="text-end">
              <button type="submit" class="btn">Generate Deposit Receipt</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
