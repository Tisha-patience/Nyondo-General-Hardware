<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NYONDO Deposit Receipt</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../static/sales-reg.css" />
  </head>

  <body>
    <div style="margin-left: 500px">
      <img
        src="../static/Images/Logo.png"
        alt="Logo"
        style="height: 100px; width: 200px; justify-content: center"
      />
    </div>
    <div class="container mt-4">
      <div class="card shadow mx-auto" style="max-width: 700px">
        <div class="card-body">
          <h2 class="text-center">
            Enroll in Salary-Earner Scheme & Record Deposit
          </h2>
          <hr />
          <form action="/" method="post">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label">Name (as on National ID):</label>
              <input
                type="text"
                class="form-control"
                name="participant_name"
                placeholder="Enter participant name"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label">NIN:</label>
              <input
                type="text"
                name="nin"
                class="form-control"
                placeholder="Enter NIN number"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Phone Number:</label>
              <input
                type="tel"
                name="phone_number"
                class="form-control"
                placeholder="Enter phone number"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Amount Paid</label>
              <input
                type="text"
                name="amount_paid"
                class="form-control"
                placeholder="Enter deposit amount"
                required
              />
            </div>
            <!-- Deposit info -->
            <label class="form-label">Product:</label>
            <select class="form-select product" name="product_name" required>
              <option value="Cement">Cement</option>
              <option value="Iron Sheets">Iron Sheets</option>
              <option value="Bars">Bars</option>
            </select>
            <div class="mb-3">
              <label class="form-label">Date</label>
              <input
                type="text"
                class="form-control"
                value="13 Apr 2026"
                readonly
              />
            </div>
            <div class="text-end">
              <button type="submit" class="btn">Save & Record Deposit</button>
            </div>
          </form>
        </div>
      </div>
      <footer class="text-center">
        © 2026 Nyondo General Hardware. All rights reserved. | Designed by Tisha
      </footer>
    </div>
  </body>
</html>
