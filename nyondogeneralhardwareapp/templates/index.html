<!doctype html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Welcome | Nyondo General Hardware Ltd
  </title>

  <!-- Bootstrap -->

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    rel="stylesheet"
  />

  <!-- Google Font -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  {% load static %}

  <link
    rel="stylesheet"
    href="{% static 'welcome.css' %}"
  />

</head>

<body>

  <!-- BACKGROUND GLOW -->

  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <!-- MAIN CONTAINER -->

  <div class="welcome-container">

    <!-- GLASS CARD -->

    <div class="welcome-card">

      <!-- LOGO -->

      <div class="logo-wrapper">

        <img
          src="{% static 'Images/Logo.png' %}"
          alt="Nyondo General Hardware Ltd Logo"
          class="logo-img"
        />

      </div>

      <!-- BADGE -->

      <div class="welcome-badge">

        <i class="bi bi-shield-check"></i>

        Trusted Hardware Management System

      </div>

      <!-- TITLE -->

      <h1 class="welcome-title">

        NYONDO GENERAL
        <span>HARDWARE LTD</span>

      </h1>

      <!-- DESCRIPTION -->

      <p class="welcome-text">

        Smart inventory, sales, supplier, and deposit
        management built for modern hardware businesses.

      </p>

      <!-- BUTTONS -->

      <div class="welcome-actions">

        <a
          href="{% url 'login' %}"
          class="btn-enter"
        >

          <i class="bi bi-box-arrow-in-right"></i>

          Continue to Login

        </a>

      </div>

      <!-- STATS -->

      <div class="mini-stats">

        <div class="stat-box">

          <i class="bi bi-box-seam"></i>

          <span>Inventory</span>

        </div>

        <div class="stat-box">

          <i class="bi bi-cash-stack"></i>

          <span>Sales</span>

        </div>

        <div class="stat-box">

          <i class="bi bi-bar-chart-line"></i>

          <span>Reports</span>

        </div>

      </div>

    </div>

  </div>

</body>
</html>
