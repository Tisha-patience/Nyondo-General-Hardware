{% extends "baseForm.html" %}
{% block content %}
<h2>Delete Sale</h2>
<p>Are you sure you want to delete this sale for <strong>{{ sale.customer_name }}</strong>?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Yes, Delete</button>
  <a href="{% url 'accountssales' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
