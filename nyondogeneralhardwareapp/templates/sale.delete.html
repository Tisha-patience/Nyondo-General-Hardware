{% extends "baseForm.html" %}
{% block content %}
<h2>Delete Sale</h2>
<p>Are you sure you want to delete this sale for <strong>{{ sale.customer_name }}</strong>?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn"><i class="bi bi-trash me-2"></i>Yes, Delete</button>
  <a href="{% url 'accountssales' %}" class="btn"><i class="bi bi-arrow-left me-2"></i>Cancel</a>
</form>
{% endblock %}
