<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deposit Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../static/sales-reg.css" />
    <style></style>
  </head>

  <body>
    <div style="margin-left: 500px">
      <img
        src="../static/Images/Logo.png"
        alt="Logo"
        style="height: 100px; width: 200px; justify-content: center"
      />
    </div>
    <div class="container mt-4">
      <div class="card shadow mx-auto" style="max-width: 800px">
        <div class="card-body">
          <h2 class="text-center">Record Deposit</h2>
          <hr />
          <form id="depositForm">
            <div class="mb-3">
              <label class="form-label">Participant (Name & NIN)</label>
              <select
                class="form-select"
                required
                style="
                  background-color: #fdfdfd;
                  border: 2px solid #a67c8a;
                  color: #333;
                  border-radius: 6px;
                  box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                "
              >
                <option selected disabled>Choose participant</option>
                <option value="123456789">John Doe - NIN: CF123456789</option>
                <option value="987654321">Jane Smith - NIN: CF987654321</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Date of Payment</label>
              <input
                type="date"
                class="form-control"
                required
                style="
                  background-color: #fdfdfd;
                  border: 2px solid #a67c8a;
                  color: #333;
                  border-radius: 6px;
                  box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                "
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Amount Paid (UGX)</label>
              <input
                type="number"
                class="form-control"
                required
                style="
                  background-color: #fdfdfd;
                  border: 2px solid #a67c8a;
                  color: #333;
                  border-radius: 6px;
                  box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                "
              />
            </div>
            <div class="text-end">
              <button type="submit" class="btn">Generate Receipt</button>
              <a href="receipt.html" class="btn">Back</a>
            </div>
          </form>
        </div>
      </div>
      <div class="container-fluid">
        <footer class="text-center border-top text-muted">
          © 2026 Nyondo General Hardware. All rights reserved. | Designed by
          Tisha
        </footer>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>

    <!-- <script>
  if (!localStorage.getItem("loggedIn")) {
    window.location.href = "login.html";
  }
</script> -->
  </body>
</html>
