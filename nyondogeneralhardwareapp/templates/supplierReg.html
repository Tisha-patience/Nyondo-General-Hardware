<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nyondo Suppliers Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../static/sales-reg.css" />
    <style></style>
  </head>

  <body>
     <div style="margin-left: 500px">
      <img
        src="../static/Images/Logo.png"
        alt="Logo"
        style="height: 100px; width: 200px; justify-content: center"
      />
    </div>
    <div class="container mt-4">
      <div class="card shadow mx-auto" style="max-width: 700px">
        <div class="card-body">
          <h2 class="text-center">Register New Supplier</h2>
          <hr />
          <form id="supplierForm">
            <!-- Supplier Info -->
            <div class="mb-3">
              <label class="form-label">Supplier Name</label>
              <input
                type="text"
                class="form-control"
                placeholder="Enter supplier name"
                required
              style="
                    background-color: #fdfdfd;
                    border: 2px solid #a67c8a;
                    color: #333;
                    border-radius: 6px;
                    box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                  "
                />
            </div>

            <div class="mb-3">
              <label class="form-label">Contact Number</label>
              <input
                type="text"
                class="form-control"
                placeholder="Enter phone number"
              style="
                    background-color: #fdfdfd;
                    border: 2px solid #a67c8a;
                    color: #333;
                    border-radius: 6px;
                    box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                  "/>
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                placeholder="Enter email"
              style="
                    background-color: #fdfdfd;
                    border: 2px solid #a67c8a;
                    color: #333;
                    border-radius: 6px;
                    box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                  "
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Address</label>
              <input
                type="text"
                class="form-control"
                placeholder="Enter address"
              style="
                    background-color: #fdfdfd;
                    border: 2px solid #a67c8a;
                    color: #333;
                    border-radius: 6px;
                    box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                  "
              />
            </div>

            <!-- Payment Terms -->
            <div class="mb-3">
              <label class="form-label">Payment Terms</label>
              <select class="form-select" required style="
                    background-color: #fdfdfd;
                    border: 2px solid #a67c8a;
                    color: #333;
                    border-radius: 6px;
                    box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                  ">
                <option selected disabled>Choose terms</option>
                <option value="cash">Cash on Delivery</option>
                <option value="credit">Credit</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Credit Terms (if applicable)</label>
              <input
                type="text"
                class="form-control"
                placeholder="e.g. Pay within 30 days"
              style="
                    background-color: #fdfdfd;
                    border: 2px solid #a67c8a;
                    color: #333;
                    border-radius: 6px;
                    box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                  "
              />
            </div>

            <!-- Notes -->
            <div class="mb-3">
              <label class="form-label">Notes</label>
              <textarea
                class="form-control"
                placeholder="Additional details (e.g. preferred delivery days, contract reference)"
              style="
                    background-color: #fdfdfd;
                    border: 2px solid #a67c8a;
                    color: #333;
                    border-radius: 6px;
                    box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                  "
              ></textarea>
            </div>

            <!-- Submit -->
            <div class="row">
              <div class="col">
              <button type="submit" class="btn">
                Save Supplier
              </button>
              </div>
              <div class="col text-end">
              <a href="../templates/supplier.html" class="btn">
                <i class="bi bi-arrow-left me-1"></i> Back
              </a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
<div class="container-fluid">
      <footer class="text-center border-top text-muted">
        © 2026 Nyondo General Hardware. All rights reserved. | Designed by Tisha
      </footer>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
