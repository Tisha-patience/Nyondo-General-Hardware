{% extends 'baseForm.html' %} {% block content %}
<div class="container mt-4">
  <div class="card shadow mx-auto" style="max-width: 700px">
    <div class="card-body">
      <h2 class="text-center">Register New Supplier</h2>
      <hr />
      <form action="/accounts/supplierReg/" method="post">
        {% csrf_token %}
        <!-- Supplier Info -->
       <!-- Supplier Name + Contact Number in one row -->
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Supplier Name</label>
            <input type="text" name="supplier_name" class="form-control"
                   placeholder="Enter supplier name" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Contact Number</label>
            <input type="text" name="contact_number" class="form-control"
                   placeholder="Enter phone number" required />
          </div>
        </div>
        <!-- Email + Address in one row -->
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control"
                   placeholder="Enter email" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Address</label>
            <input type="text" name="address" class="form-control"
                   placeholder="Enter address" required />
          </div>
        </div>

        <!-- Payment Terms -->
        <div class="mb-3">
          <label class="form-label">Payment Terms</label>
          <select class="form-select"  name="payment_terms"  required>
            <option selected disabled>Choose terms</option>
            <option value="Cash">Cash</option>
            <option value="Credit">Credit</option>
          </select>
        </div>

         <div  >
    <label class="form-label">Credit Terms:</label>
    <input type="text" name="credit_terms" class="form-control"  placeholder="e.g. 30 days">
  </div>
        <hr />

        <!-- Submit -->
        <div class="row">
          <div class="col">
            <button type="submit" class="btn">Save Supplier</button>
          </div>
          <div class="col text-end">
            <a href="{% url 'accountssupplier' %}" class="btn">
              <i class="bi bi-arrow-left me-1"></i> Back
            </a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
