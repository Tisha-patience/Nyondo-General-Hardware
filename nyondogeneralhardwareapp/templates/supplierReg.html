<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nyondo Stock Suppliers</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../static/supplier-reg.css" />
    <style></style>
  </head>

  <body>
    <nav
      class="navbar navbar-expand-lg navbar-dark"
      style="background: linear-gradient(135deg, #563f46, #6d4c55, #3c2f3d)"
      data-bs-theme="dark border-bottom bg-dark"
    >
      <div class="container-fluid">
        <a class="navbar-brand px-2">Nyondo Stock System</a>

        <div class="d-flex py-2 mx-5" role="search">
          <div class="position-relative">
            <input
              style="
                background: linear-gradient(135deg, #563f46, #6d4c55, #3c2f3d);
                border: 2px solid #a67c8a;
                color: #d6d4e0;
                box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                margin-right: 500px;
              "
              class="form-control ps-5"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <i
              class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-white"
            ></i>
          </div>
        </div>
        <!-- Notification -->
        <a class="nav-link" href="#">
          <i class="bi bi-bell" style="font-size: 24px; color: whitesmoke"></i>
        </a>
      </div>
    </nav>
    <div class="row">
      <div
        class="col-sm-2 py-2 px-5 sidebar-gradient d-flex flex-column"
        style="min-height: 100vh"
      >
        <h6 class="text-white mt-3">Menu</h6>
        <hr />
        <div>
          <a class="nav-link nav-list text-white" href="./dashboard.html"
            >Dashboard</a
          >
        </div>
        <br />
        <div>
          <a class="nav-link text-white" href="../sales/salesManagement.html"
            >Sales</a
          >
        </div>
        <br />
        <div>
          <div class="dropdown d-flex align-items-center">
            <a class="nav-link text-white me-1 active" href="./supplier.html"
              >Suppliers</a
            >

            <a
              class="text-white dropdown-toggle toggle-arrow"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
            </a>
            <ul class="dropdown-menu dropdown-menu-dark">
              <li>
                <a class="dropdown-item active" href="./supplierReg.html"
                  >Register Supplier</a
                >
              </li>
              <li>
                <a class="dropdown-item" href="./supplier-credit.html"
                  >Supplier Credit</a
                >
              </li>
            </ul>
          </div>
        </div>
        <br />
        <div>
          <a class="nav-link text-white" href="./stock.html">Stock</a>
        </div>
        <br />

        <div>
          <a class="nav-link text-white" href="./logout.html">Log Out</a>
        </div>
      </div>
      <div class="col mt-3" style="margin-left: 268px">
        <div
          class="card shadow main-content"
          style="height: 800px; width: 500px; padding: 20px"
        >
          <div class="card-body">
            <h1 class="card-title text-center mb-5">Supplier Registration</h1>
            <hr />
            <form>
              <div class="row">
                <div class="col mb-3">
                  <label for="formGroupExampleInput" class="form-label"
                    >Supplier Name</label
                  >
                  <input
                    style="
                      background-color: #fdfdfd;
                      border: 2px solid #a67c8a;
                      color: #333;
                      border-radius: 6px;
                      box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                    "
                    type="text"
                    class="form-control"
                    placeholder="Enter supplier name"
                    aria-label="First name"
                  />
                </div>
                <div class="col">
                  <label for="formGroupExampleInput" class="form-label"
                    >Contact Person</label
                  >
                  <input
                    style="
                      background-color: #fdfdfd;
                      border: 2px solid #a67c8a;
                      color: #333;
                      border-radius: 6px;
                      box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                    "
                    type="text"
                    class="form-control"
                    placeholder="Enter contact of supplier"
                    aria-label="Last name"
                  />
                </div>
              </div>

              <div class="col mb-3">
                <label for="formGroupExampleInput" class="form-label"
                  >Phone Number</label
                >
                <input
                  style="
                    background-color: #fdfdfd;
                    border: 2px solid #a67c8a;
                    color: #333;
                    border-radius: 6px;
                    box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                  "
                  type="number"
                  class="form-control"
                  placeholder="Enter phone number"
                  aria-label="First name"
                />
              </div>
              <div class="col mb-3">
                <label for="formGroupExampleInput" class="form-label"
                  >Email Address</label
                >
                <input
                  style="
                    background-color: #fdfdfd;
                    border: 2px solid #a67c8a;
                    color: #333;
                    border-radius: 6px;
                    box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                  "
                  type="email"
                  class="form-control"
                  placeholder="Enter email"
                  aria-label="Last name"
                />
              </div>
              <div class="col mb-3">
                <label for="formGroupExampleInput" class="form-label"
                  >Company Address</label
                >
                <input
                  style="
                    background-color: #fdfdfd;
                    border: 2px solid #a67c8a;
                    color: #333;
                    border-radius: 6px;
                    box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                  "
                  type="text"
                  class="form-control"
                  placeholder="Enter company address"
                  aria-label="Last name"
                />
              </div>

              <div class="row">
                <div class="col mb-3">
                  <label for="formGroupExampleInput" class="form-label"
                    >Supplier Type</label
                  >
                  <select
                    style="
                      background-color: #fdfdfd;
                      border: 2px solid #a67c8a;
                      color: #333;
                      border-radius: 6px;
                      box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                    "
                    class="form-select"
                    aria-label="Default select example"
                  >
                    <option selected disabled>Select supplier type</option>
                    <option value="local">Local</option>
                    <option value="international">International</option>
                  </select>
                </div>
                <div class="col mb-3">
                  <label for="formGroupExampleInput" class="form-label"
                    >Payment Terms</label
                  >
                  <select
                    style="
                      background-color: #fdfdfd;
                      border: 2px solid #a67c8a;
                      color: #333;
                      border-radius: 6px;
                      box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                    "
                    class="form-select"
                    aria-label="Default select example"
                  >
                    <option selected>Select payment term</option>
                    <option value="cash">Cash</option>
                    <option value="credit">Credit</option>
                  </select>
                </div>
              </div>

              <div class="row">
                <div class="col mb-3">
                  <label for="formGroupExampleInput" class="form-label"
                    >Products Supplied</label
                  >
                  <textarea
                    style="
                      background-color: #fdfdfd;
                      border: 2px solid #a67c8a;
                      color: #333;
                      border-radius: 6px;
                      box-shadow: 0 0 6px rgba(166, 124, 138, 0.4);
                    "
                    id="products"
                    name="products"
                    rows="2"
                  ></textarea>
                </div>
              </div>

              <div class="row">
                <div class="col">
                  <button type="button" class="btn btn-sm">Cancel</button>
                </div>
                <div class="col text-end">
                  <button type="button" class="btn btn-sm">Submit</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <!-- div for the row -->
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
