name: Python CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install linting tools
        run: pip install ruff

      - name: Check formatting and linting
        continue-on-error: true
        run: ruff check .

      - name: Check for committed Python cache files
        continue-on-error: true
        run: |
          CACHE_FILES=$(find . \( -type d -name "__pycache__" -o -name "*.pyc" \))

          if [ -n "$CACHE_FILES" ]; then
            echo "❌ Python cache files were found in the repository:"
            echo "$CACHE_FILES"
            echo ""
            echo "Please remove all __pycache__ directories and *.pyc files before committing."
            exit 1
          fi

          echo "✅ No Python cache files found."

      - name: Placeholder test suite
        run: |
          echo "Running placeholder tests..."
          python -c "assert True"
          echo "✅ All tests passed."